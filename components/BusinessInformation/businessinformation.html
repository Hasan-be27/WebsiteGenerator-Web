<section class="business-information card component-card shadow-sm border-0 mb-4">

    <div>

    <div class="card-header component-header py-3 px-4 d-flex align-items-center justify-content-between">

        <div>
            <h4 class="mb-0 d-flex align-items-center">
                <i class="bi bi-building me-2 text-primary"></i>
                Business Information
            </h4>
            <small class="text-muted">
                Basic information about your business
            </small>
        </div>

        <!-- Reserved for future actions -->
        <!--
        <div class="component-actions">
            <button class="btn btn-sm btn-outline-secondary">
                ?
            </button>
        </div>
        -->

    </div>

    <div class="card-body p-4">

        <div class="row g-3">

            <div class="col-lg-6">

                <label
                    for="business-name"
                    class="form-label">

                    Business Name
                    <span class="text-danger">*</span>

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-name"
                    placeholder="Enter your business name">

            </div>

            <div class="col-lg-6">

                <label
                    for="business-type"
                    class="form-label">

                    Business Type

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-type"
                    placeholder="Restaurant, Agency, Clinic...">

            </div>

            <div class="col-lg-6">

                <label
                    for="business-phone"
                    class="form-label">

                    Phone
                    <span class="text-danger">*</span>

                </label>

                <input
                    type="number"
                    class="form-control"
                    id="business-phone"
                    placeholder="+91 9876543210">

            </div>

            <div class="col-lg-6">

                <label
                    for="business-email"
                    class="form-label">

                    Email

                </label>

                <input
                    type="email"
                    class="form-control"
                    id="business-email"
                    placeholder="contact@example.com">

            </div>

            <div class="col-12">

                <label
                    for="business-address-1"
                    class="form-label">

                    Address Line 1

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-address-1">

            </div>

            <div class="col-12">

                <label
                    for="business-address-2"
                    class="form-label">

                    Address Line 2

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-address-2">

            </div>

            <div class="col-md-4">

                <label
                    for="business-city"
                    class="form-label">

                    City

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-city">

            </div>

            <div class="col-md-4">

                <label
                    for="business-state"
                    class="form-label">

                    State

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-state">

            </div>

            <div class="col-md-4">

                <label
                    for="business-pin"
                    class="form-label">

                    PIN Code

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="business-pin">

            </div>

            <div class="col-12">

                <label
                    for="business-description"
                    class="form-label">

                    Business Overview

                </label>

                <textarea
                    class="form-control"
                    id="business-description"
                    rows="5"
                    placeholder="Describe your business..."></textarea>

            </div>

        </div>

    </div>

</div>

</section>
