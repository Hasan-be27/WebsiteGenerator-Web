<section class="highlight card component-card shadow-sm border-0 mb-4 mt-4">

    <div class="py-3 px-4">

    <div class="card-header component-header">
        
        <h2><i class="bi bi-stars me-2"></i>Highlight Strip</h2>

        <p>
            Optional message displayed between sections to grab attention.
        </p>

    </div>

    <div class="component-body">

        <label
            for="highlight-tagline"
            class="form-label">
            <i class="bi bi-megaphone me-2"></i>
            Highlight Message

        </label>

        <textarea
            id="highlight-tagline"
            class="form-control"
            rows="3"
            maxlength="150"
            placeholder="Quality service you can trust.">

        </textarea>

        <div class="form-text">

            Recommended: 50–120 characters.

        </div>

    </div>

</div>

</section>
