<section class="success-page container py-5">

    <div class="success-card">

        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1>Website Published Successfully</h1>

        <p class="success-message">
            Your website has been published and is being prepared by GitHub Pages.
        </p>

        <div class="success-location">
            <span class="success-label">Live Website</span>
            <a
                id="success-website-url"
                href="#"
                target="_blank"
                rel="noopener noreferrer">
                Your website link
            </a>
        </div>

        <div class="success-warning">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span>
                If the website shows a 404 error when you open it, please for some time
                for GitHub Pages to finish deploying, then try again.
            </span>
        </div>

        <div class="success-actions">

            <button
                type="button"
                class="btn btn-primary"
                id="save-website-btn">
                <i class="bi bi-folder2-open me-2"></i>
                Save Website Locally
            </button>

            <a
                class="btn btn-outline-light"
                id="open-website-btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer">
                <i class="bi bi-box-arrow-up-right me-2"></i>
                Open Website
            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="home-btn">
                <i class="bi bi-house me-2"></i>
                Back to Home
            </button>

        </div>

        <div
            id="save-website-status"
            class="save-website-status d-none"
            aria-live="polite">
        </div>

    </div>

</section>
