<section class="about card component-card shadow-sm border-0 mb-4 mt-4">

    <div class="py-3 px-4">

    <div class="card-header component-header">
        <i class="bi bi-info-circle-fill me-2"></i>
        <h2>About</h2>
        <p>Introduce your business to visitors.</p>
    </div>

    <div class="component-body">

        <div class="mb-4">

            <label
                for="about-image"
                class="form-label">
                <i class="bi bi-card-image me-2"></i>
                About Image *

            </label>

            <button
                id="about-image-button"
                class="btn btn-outline-primary"
                type="button">
                <i class="bi bi-upload me-2"></i>
                Select About Image

            </button>

            <div
                id="about-image-name"
                class="small text-muted mt-2">

                No image selected

            </div>

            <div class="image-preview-container mt-3">

                <img
                    id="about-preview"
                    class="image-preview"
                    hidden>

            </div>

        </div>

        <div class="mb-3">

            <label
                for="about-heading"
                class="form-label">
                <i class="bi bi-type-h2 me-2"></i>
                Section Heading

            </label>

            <input
                id="about-heading"
                class="form-control"
                type="text"
                value="About Us">

        </div>

        <div>

            <label
                for="about-description"
                class="form-label">
                <i class="bi bi-text-paragraph me-2"></i>
                Description *

            </label>

            <textarea
                id="about-description"
                class="form-control"
                rows="6"
                placeholder="Tell visitors about your business..."></textarea>

        </div>

    </div>

</div>
</section>
